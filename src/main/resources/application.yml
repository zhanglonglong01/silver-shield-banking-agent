spring:
  application:
    name: silver-shield-banking-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/silver_shield?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:silver}
    password: ${DB_PASSWORD:silver_demo_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  ai:
    tools:
      resolution:
        fallback:
          enabled: false
    chat:
      client:
        tool-calling:
          enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: never

silvershield:
  security:
    session-ttl: PT2H
  sandbox:
    enabled: false
    dataset-version: fintechathon-demo-v1
    random-seed: 2026
    baseline-date: 2026-08-31
