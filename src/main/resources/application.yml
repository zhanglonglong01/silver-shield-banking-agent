spring:
  application:
    name: silver-shield-banking-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/silver_shield?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:silver}
    password: ${DB_PASSWORD:silver_demo_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  ai:
    model:
      chat: ${SPRING_AI_CHAT_MODEL:none}
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.1
    tools:
      resolution:
        fallback:
          enabled: false
    chat:
      client:
        enabled: false
        tool-calling:
          enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    try-it-out-enabled: false
  packages-to-scan: com.fintechathon.silvershield

logging:
  pattern:
    level: "%5p [trace:%X{traceId:-none}]"

silvershield:
  security:
    session-ttl: PT2H
    aal2-ttl: PT5M
    sandbox-aal2-code: ${SANDBOX_AAL2_CODE:}
  tool-security:
    policy-version: m6-cross-scene-orchestration-v1
    snapshot-ttl: PT60S
    max-arguments-bytes: 8192
  transfer-security:
    operation-ttl: PT5M
    idempotency-ttl: PT24H
    aal2-threshold: 10000.00
    velocity-window: PT10M
    velocity-max-count: 3
    velocity-max-amount: 20000.00
  wealth-security:
    suitability-ttl: PT10M
  agent:
    max-tool-rounds: 5
    max-tool-calls-per-round: 4
    max-total-tool-calls: 12
    model-timeout: PT20S
    tool-timeout: PT5S
    max-user-message-chars: 4000
    max-context-chars: 65536
    max-answer-chars: 8000
    conversation-ttl: PT30M
    max-conversation-messages: 12
  sandbox:
    enabled: false
    dataset-version: fintechathon-demo-v2
    random-seed: 2026
    baseline-date: 2026-08-31
